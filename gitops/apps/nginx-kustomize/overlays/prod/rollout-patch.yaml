apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx
spec:
  replicas: 2

  template:
    metadata:
      labels:
        environment: prod

    spec:
      containers:
        - name: nginx

          resources:
            requests:
              cpu: 200m
              memory: 256Mi

            limits:
              cpu: 750m
              memory: 512Mi