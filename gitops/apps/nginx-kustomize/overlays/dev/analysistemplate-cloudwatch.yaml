apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: nginx-canary-error-rate
spec:
  args:
    - name: canary-target-group
  metrics:
    - name: error-rate
      interval: 30s
      count: 4
      successCondition: result[0] < 5
      failureLimit: 1
      provider:
        prometheus:
          address: http://yace.monitoring.svc.cluster.local:80
          query: |
            sum(aws_applicationelb_httpcode_target_5_xx_count_sum{dimension_TargetGroup=~".*{{args.canary-target-group}}.*"}) or vector(0)