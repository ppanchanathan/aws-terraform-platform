apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: platform
  namespace: argocd

spec:
  description: Platform applications

  sourceRepos:
    - https://github.com/ppanchanathan/aws-terraform-platform.git
    - https://charts.jetstack.io

  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'