apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ppanchanathan/aws-terraform-platform.git
    targetRevision: main
    path: gitops/apps/alertmanager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true