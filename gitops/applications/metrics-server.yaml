apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metrics-server
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://github.com/ppanchanathan/aws-terraform-platform.git
    targetRevision: main
    path: gitops/apps/metrics-server

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true