apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ppanchanathan/aws-terraform-platform.git
    targetRevision: main
    path: gitops/argocd/projects

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true