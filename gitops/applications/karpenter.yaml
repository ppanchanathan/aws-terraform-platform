apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.8.0"
    helm:
      values: |
        replicas: 1
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::240815058507:role/platform-dev-karpenter
        settings:
          clusterName: platform-dev-eks
          interruptionQueue: platform-dev-eks-karpenter-interruption
          featureGates:
            reservedCapacity: true
            spotToSpotConsolidation: false
            nodeRepair: false
            nodeOverlay: false
            staticCapacity: false
        controller:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true