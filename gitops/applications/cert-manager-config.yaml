apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-manager-config
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://github.com/ppanchanathan/aws-terraform-platform.git
    targetRevision: main
    path: gitops/apps/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true