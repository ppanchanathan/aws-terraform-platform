apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ppanchanathan/aws-terraform-platform.git
    targetRevision: main
    path: gitops/apps/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true